name: Deploy schema to Snowflake
# Runs when you push a version tag (v1.0.1) or trigger it manually.
# Protect the "production" environment in GitHub (Settings > Environments) to require approval.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "migrate or rollback"
        default: "migrate"
        type: choice
        options: [migrate, rollback]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: sfpipe status
      - run: sfpipe ${{ github.event.inputs.action || 'migrate' }}
      - run: sfpipe status
